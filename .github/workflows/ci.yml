name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -o clamguard .

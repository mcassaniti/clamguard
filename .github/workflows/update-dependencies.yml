name: Update Dependencies

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Check & Update Go Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Update Go Dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Check for Changes
        id: git-check
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No dependency updates found."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Dependencies updated."
          fi

      - name: Run Tests on Updated Dependencies
        if: steps.git-check.outputs.changed == 'true'
        run: go test -v -race ./...

      - name: Create Pull Request with Version Bump
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "deps: update Go module dependencies"
          title: "deps: automated Go module dependency updates"
          body: |
            Automated dependency update generated by scheduled workflow.
            
            - Ran `go get -u ./...` and `go mod tidy`.
            - Verified all unit tests and race detectors pass.
          branch: "automated-deps-update"
          base: "main"
          delete-branch: true

name: Bump Version and Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 0.2.0). Leave blank to auto-bump patch.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  bump-tag:
    name: Bump Version and Push Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate and Create Tag
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin

          LATEST_TAG=$(git tag --sort=-v:refname | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "Latest existing tag: ${LATEST_TAG:-none}"

          if [ -n "$INPUT_VERSION" ]; then
            # Strip leading 'v' if supplied
            NEW_VER="${INPUT_VERSION#v}"
          elif [ -z "$LATEST_TAG" ]; then
            echo "Could not find latest version tag"
            exit 1
          else
            VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          NEW_TAG="v${NEW_VER}"
          echo "Target tag: ${NEW_TAG}"

          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "Error: Tag ${NEW_TAG} already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Tagging ${NEW_TAG} with message 'Version ${NEW_VER}'"
          git tag -a -m "Version ${NEW_VER}" "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_ver=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Trigger Release Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "Triggering release workflow for ${TAG}..."
          gh workflow run release.yml --ref "${TAG}"
